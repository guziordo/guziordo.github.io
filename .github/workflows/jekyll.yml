# Sample workflow for building and deploying a Jekyll site to GitHub Pages
name: Deploy Jekyll site to Pages

on:
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    # FIX 1: Use 22.04 to ensure Ruby 3.1 binary compatibility
    runs-on: ubuntu-22.04 
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        # FIX 2: Use the version tag instead of the specific long SHA for better reliability
        uses: ruby/setup-ruby@v1 
        with:
          ruby-version: '3.1' 
          bundler-cache: true 
          cache-version: 1 

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build with Jekyll
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production

      - name: Upload artifact
        # FIX 3: Update to v3 (for upload-pages-artifact) or ensure it matches the latest internal specs
        # Note: actions/upload-pages-artifact@v3 is actually the current stable for Pages,
        # but your previous error likely came from a generic 'upload-artifact@v3' elsewhere.
        uses: actions/upload-pages-artifact@v3

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
